<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動回饋 - 水井村教育網站</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-sub">
    <header class="glass-header">
        <h1>蛤～你怎麼不知道！</h1>
        <p>互動回饋中心</p>
    </header>

    <div class="glass-card">
        <h2>💬 互動回饋</h2>
        <p>您的建議是我們持續推動水井村文化數位保存的重要動力。</p>
        
        <div class="sub-card">
            <h3 style="color: #ffcc00;">留下您的想法</h3>
            <p>無論是關於文蛤養殖技術的補充，或對網站的建議，都歡迎告訴我們！</p>
            <textarea id="user-comment" class="app-input" placeholder="寫下您的回饋..."></textarea>
            <button onclick="submitFeedback()" class="btn-ar" style="width: 100%; margin-top: 10px;">🚀 送出留言</button>
        </div>

        <div class="sub-card" style="margin-top: 20px;">
            <h3 style="color: #ffcc00;">留言牆</h3>
            <ul id="comment-list" class="comment-wall">
                <li style="list-style: none; opacity: 0.6;">目前尚無留言，成為第一個留下足跡的人吧！</li>
            </ul>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn-home">🏠 回主畫面</a>
            <p style="font-size: 0.8rem; opacity: 0.5;">SDG 17 夥伴關係</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
