<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>導覽地圖 - 水井村教育網站</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="bg-sub">
    <div class="glass-card">
        <h2>📍 水井村實境導覽</h2>
        <p>直接透過地圖查看水井村位置，並結合 QR Code 進行實地探索。</p>
        
        <div class="map-wrapper" style="width: 100%; border-radius: 20px; overflow: hidden; margin: 20px 0; border: 2px solid rgba(255,255,255,0.2);">
            <iframe 
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3658.647!2d120.156!3d23.5415!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x346e969!2zNjUy6Zuy5p6X57ij5Y-j5rmW6YSJ5rC05LqV5p2R!5e0!3m2!1szh-TW!2stw!4v1711234567890!5m2!1szh-TW!2stw" 
                width="100%" 
                height="400" 
                style="border:0;" 
                allowfullscreen="" 
                loading="lazy" 
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>
        </div>

        <div class="sub-card">
            <h4 style="color: #ffcc00;">💡 如何開始導覽？</h4>
            <ul style="text-align: left; font-size: 0.9rem;">
                <li>在地圖中找到「聖天宮」或「文蛤養殖區」。</li>
                <li>親臨現場尋找設有計畫 Logo 的 QR Code 立牌。</li>
                <li>掃描立牌，將跳轉至該處的數位深度故事。</li>
            </ul>
        </div>

        <div class="btn-group">
            <a href="index.html" class="btn-home">🏠 回主畫面</a>
            <a href="feedback.html" class="btn-next">下一步：互動回饋 ➔</a>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 水井村數位保存計畫</p>
    </footer>
</body>
</html>
